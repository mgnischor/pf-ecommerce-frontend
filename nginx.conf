# SPA fallback + cache policy: hashed assets immutable, index.html never cached.
# Health endpoint for container probes; the API itself is never proxied publicly here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
    try_files $uri =404;
  }

  location / {
    expires -1;
    add_header Cache-Control 'no-store';
    try_files $uri $uri/ /index.html;
  }
}
